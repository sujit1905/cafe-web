version: '3.9'

services:
  # ──────────────────────────────────────────────
  # MongoDB (local dev database)
  # ──────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: brew_bite_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: brewandbite
    networks:
      - brew_bite_network

  # ──────────────────────────────────────────────
  # Backend API (Node.js / Express)
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brew_bite_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/brewandbite
      JWT_SECRET: brew_bite_docker_jwt_secret_change_in_production
      CLIENT_URL: http://localhost:5173
      ADMIN_EMAIL: admin@brewandbite.com
      ADMIN_PASSWORD: Admin@12345
      NODE_ENV: development
      SEED_ON_START: 'true'
    depends_on:
      - mongo
    networks:
      - brew_bite_network

  # ──────────────────────────────────────────────
  # Frontend (Vite / React)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brew_bite_frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - brew_bite_network

volumes:
  mongo_data:
    driver: local

networks:
  brew_bite_network:
    driver: bridge
